[package]
name = "ragb"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gl = "0.6.0"
bitflags = "2.1.0"
bitmask-enum = "2.1.0"
nom = "7.1.3"
gdbstub = "0.6.6"
gdbstub_arch = "0.2.4"
tokio = { version = "1.27.0", features = ["full"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[dependencies.sdl2]
version = "0.35.2"
default-features = false
features = ["ttf","image","gfx","mixer"]
